[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossfoot"
version = "0.0.1"
description = "Reconciles receipts against bank statements, and says so when it cannot"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
# Deliberately empty for now. The verdict layer is arithmetic and stdlib, and
# it should stay installable by someone who only wants that. Docling, the OCR
# stack and the dashboard belong in extras when they arrive.
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "pillow"]
# Layout parsing. Optional because the checking layer is arithmetic and stdlib,
# and someone who only wants to reconcile numbers they already have should not
# have to install a machine-learning stack to do it.
read = ["docling"]
# Photographs. Tesseract is fast and accurate and needs a system binary;
# easyocr needs none but is a much heavier install. Both run locally on
# already-present data — there is deliberately no cloud backend, because an
# OCR API is the one line of code that would turn "your receipts never leave
# this machine" into a lie.
ocr = ["pytesseract", "pillow"]
ocr-heavy = ["easyocr"]
ui = ["streamlit>=1.49"]

[project.scripts]
crossfoot = "crossfoot.cli:main"

[tool.setuptools]
# Subpackages are not implied by naming the parent. Naming only "crossfoot"
# ships a wheel with ingest/, read/, match/ and review/ missing entirely.
packages = ["crossfoot", "crossfoot.ingest", "crossfoot.read",
            "crossfoot.match", "crossfoot.review", "crossfoot.export"]

[tool.pytest.ini_options]
testpaths = ["tests"]
