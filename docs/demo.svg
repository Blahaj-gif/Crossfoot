<svg xmlns="http://www.w3.org/2000/svg" width="760" height="771" viewBox="0 0 760 771" role="img" aria-label="Crossfoot audits a bank statement, then refuses to report anything once one balance is altered"><title>crossfoot audit</title><g transform="translate(0,0)"><rect width="760.35" height="445" rx="8" fill="#12151c"/><rect width="760.35" height="30" rx="8" fill="#1b1f29"/><rect y="22" width="760.35" height="8" fill="#1b1f29"/><circle cx="18" cy="15" r="5" fill="#e2807f"/><circle cx="33" cy="15" r="5" fill="#e6b566"/><circle cx="48" cy="15" r="5" fill="#7fd18d"/><text x="380.175" y="19" fill="#7d8798" font-size="11" text-anchor="middle" font-family="ui-monospace,monospace">what is wrong with this statement</text><text x="18" y="61" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#7fd18d">$</tspan><tspan fill="#7fb2e6"> crossfoot audit </tspan><tspan fill="#d6dae4">statement.csv</tspan></text><text x="18" y="80" fill="#7fd18d" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">statement.csv: 63 rows, whole</text><text x="18" y="99" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"></text><text x="18" y="118" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  What looks wrong — 974.07 at stake</text><text x="18" y="137" fill="#e2807f" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">        842.19  PAID TWICE     two charges of 842.19 at this merchant, the same day</text><text x="18" y="156" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">          (2026-04-22 and 2026-04-22)</text><text x="18" y="175" fill="#e6b566" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">         95.88  NEW RECURRING  audiobook club started charging 7.99 monthly on 2026-03-17 —</text><text x="18" y="194" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">           95.88 a year</text><text x="18" y="213" fill="#e6b566" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">         36.00  PRICE ROSE     streamline music went from 8.99 to 11.99 on 2026-04-03 —</text><text x="18" y="232" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">           36.00 a year</text><text x="18" y="251" fill="#e2807f" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">          0.00  PAID TWICE     two charges of 31.50 at this merchant, the same day</text><text x="18" y="270" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">            (2026-05-09 and 2026-05-09) — and a refund of the same amount on 2026-05-14, so</text><text x="18" y="289" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">            this one was already put right</text><text x="18" y="308" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"></text><text x="18" y="327" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  Recurring charges — 14,591.28 a year, not a finding, just what is there</text><text x="18" y="346" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">     13,200.00/yr  1,100.00 × 6   rent wilson properties  since 2026-01-02</text><text x="18" y="365" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">        509.52/yr     42.46 × 6   city water board  since 2026-01-05</text><text x="18" y="384" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">        378.00/yr     31.50 × 4   corner market  since 2026-01-26</text><text x="18" y="403" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">        264.00/yr     22.00 × 6   mobile network  since 2026-01-08</text><text x="18" y="422" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">        143.88/yr     11.99 × 6   streamline music  since 2026-01-03</text><text x="18" y="441" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">         95.88/yr      7.99 × 4   audiobook club  since 2026-03-17</text></g><text x="18" y="490" fill="#7d8798" font-size="12" font-family="ui-monospace,monospace">now change one balance by 100 — the whole report goes silent, because a duplicate found in a</text><text x="18" y="509" fill="#7d8798" font-size="12" font-family="ui-monospace,monospace">statement with rows missing is an artefact of the gap</text><g transform="translate(0,524)"><g transform="translate(0,0)"><rect width="760.35" height="236" rx="8" fill="#12151c"/><rect width="760.35" height="30" rx="8" fill="#1b1f29"/><rect y="22" width="760.35" height="8" fill="#1b1f29"/><circle cx="18" cy="15" r="5" fill="#e2807f"/><circle cx="33" cy="15" r="5" fill="#e6b566"/><circle cx="48" cy="15" r="5" fill="#7fd18d"/><text x="380.175" y="19" fill="#7d8798" font-size="11" text-anchor="middle" font-family="ui-monospace,monospace">the same statement, one balance changed</text><text x="18" y="61" font-size="13" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"><tspan fill="#7fd18d">$</tspan><tspan fill="#7fb2e6"> crossfoot audit </tspan><tspan fill="#d6dae4">statement.csv</tspan></text><text x="18" y="80" fill="#e6b566" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">statement.csv: 63 rows, incomplete</text><text x="18" y="99" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"></text><text x="18" y="118" fill="#e6b566" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  findings are withheld because this export is not complete: row 8: 4257.51 -35.31 should</text><text x="18" y="137" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">    leave 4222.20, but the statement says 4322.20 — a row is missing here</text><text x="18" y="156" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"></text><text x="18" y="175" fill="#7d8798" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  Nothing else is reported from this file. A duplicate found in</text><text x="18" y="194" fill="#7d8798" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  a statement with rows missing is an artefact of the gap, and</text><text x="18" y="213" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  the rows that were never read cannot be reported as missing —</text><text x="18" y="232" fill="#d6dae4" font-size="13" xml:space="preserve" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">  so a short, clean page here would be a misleading one.</text></g></g></svg>